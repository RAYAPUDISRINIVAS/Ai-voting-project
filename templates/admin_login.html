{% extends "base.html" %}
{% block title %}Administrator sign in · CivicDemo{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
  <div class="page-heading"><div class="eyebrow">ADMIN ACCESS</div><h1>Administrator sign in</h1><p>Administrator accounts must be created with the development-only CLI command.</p></div>
  <form method="post" class="panel-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="identifier">Administrator email</label><input class="form-control mb-3" id="identifier" name="identifier" type="email" autocomplete="username" required>
    <label class="form-label" for="password">Password</label><input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
  </form>
</div></div>
{% endblock %}
