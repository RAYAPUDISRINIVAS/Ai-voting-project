{% extends "base.html" %}
{% block title %}Edit election · CivicDemo{% endblock %}
{% block content %}
<div class="page-heading"><div class="eyebrow">ADMINISTRATION</div><h1>Edit election</h1><p>Update times and the publication preference for this election.</p></div>
<form method="post" class="panel-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label" for="title">Title</label><input class="form-control mb-3" id="title" name="title" maxlength="160" required value="{{ election.title }}">
  <label class="form-label" for="description">Description</label><textarea class="form-control mb-3" id="description" name="description" rows="3">{{ election.description }}</textarea>
  <div class="row g-3 mb-3"><div class="col-md-6"><label class="form-label" for="start_time">Start time (UTC)</label><input class="form-control" type="datetime-local" id="start_time" name="start_time" required value="{{ election.start_time.strftime('%Y-%m-%dT%H:%M') }}"></div>
  <div class="col-md-6"><label class="form-label" for="end_time">End time (UTC)</label><input class="form-control" type="datetime-local" id="end_time" name="end_time" required value="{{ election.end_time.strftime('%Y-%m-%dT%H:%M') }}"></div></div>
  <div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="publish_results" id="publish_results" value="yes" {% if election.publish_results %}checked{% endif %}><label class="form-check-label" for="publish_results">Publish results while election is open</label></div>
  <button class="btn btn-primary" type="submit">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin.elections') }}">Cancel</a>
</form>
{% endblock %}
